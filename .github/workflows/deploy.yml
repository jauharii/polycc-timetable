name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 19 * * 0'   # Weekly: Sunday 19:00 UTC = Monday 03:00 GMT+8
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Job 1: Split agencies into chunks
  split-agencies:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
      has-chunks: ${{ steps.split.outputs.has-chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split agencies into chunks of 5
        id: split
        run: |
          chunks=$(python3 scripts/split_agencies.py 5)
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          if [ "$chunks" = "[]" ]; then
            echo "has-chunks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-chunks=true" >> "$GITHUB_OUTPUT"
          fi

  # Job 2: Parallel scrape each chunk
  scrape:
    needs: split-agencies
    if: ${{ needs.split-agencies.outputs.has-chunks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.split-agencies.outputs.chunks) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Create cache directory
        run: mkdir -p data/cache

      - name: Scrape chunk
        run: |
          python3 import_polycc.py --agencies '${{ toJson(matrix.chunk) }}'

      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ strategy.job-index }}
          path: data/cache/
          retention-days: 1

  # Job 3: Merge caches, export JSON, build, deploy
  merge-and-deploy:
    needs: [split-agencies, scrape]
    if: ${{ always() && needs.split-agencies.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Download all cache artifacts
        if: ${{ needs.split-agencies.outputs.has-chunks == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: cache-*
          path: data/cache/
          merge-multiple: true

      - name: Merge caches to DB and export JSON
        run: |
          python3 import_polycc.py --merge-only
          python3 scripts/export_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true